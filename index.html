<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox-practice</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- normalize css -->
    <link rel="stylesheet" href="/normalize.css"/>
    <link rel="stylesheet" href="/styles/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="row"> 
        <div class="container firstblock">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
        </div>
        <div class="container secondblock">
          <div class="item-rectangle"></div>
          <div class="item-rectangle"></div>
          <div class="item-rectangle"></div>
        </div>
      </div>
      <div class="row">
        <div class="container thirdblock">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
        </div>
        <div class="container fourthblock">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item fourthblockitem"></div>
        </div>
      </div>
      <div class="row">
        <div class="container fifthblock">
          <div class="item-rectangle">Some text</div>
          <div class="item fifthblockitem">Some text</div>
          <div class="item-rectangle">Some text</div>
        </div>
        <div class="container sixthblock">
          <div class="item"></div>
          <div class="item-widerectangle"></div>
          <div class="item"></div>
        </div>
      </div>
    </div>
  </body>
</html>
